  function guessCat(t,mc){t=(" "+t+" ").toLowerCase();for(const g of KW)if(g.w.some(w=>t.includes(w.toLowerCase())))return g.cat;mc=String(mc||"");if(/דלק/.test(mc))return"fuel";if(/רכב|תחבורה/.test(mc))return"garage";return null}
  function parseDate(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());

    const s=String(v||"").trim();let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}

    let ai=row.findIndex(h=>/סכום חיוב/.test(h));if(ai<0)ai=row.findIndex(h=>/סכום|חובה|חיוב/.test(h));const ci=row.findIndex(h=>/^קטגוריה|ענף/.test(h));
    if(di>=0&&mi>=0&&ai>=0)return{r,di,mi,ai,ci}}return null}
  let CAND=[];
  const step=n=>R("imp").querySelectorAll("[data-st]").forEach(s=>s.classList.toggle("on",+s.dataset.st===n));
  function openImp(){step(1);R("impacts").hidden=true;
    R("impbody").innerHTML=`<p class="mx-sub" style="margin:0">מעלים קובץ פירוט של כרטיס אשראי או בנק (Excel או CSV, למשל מ-MAX). מוצגות רק שורות שנראות כמו דלק, מוסך, צמיגים, טסט, ביטוח, חניה וכביש 6. <b>שום דבר לא נשמר עד שתלחץ "אשר והוסף"</b>, והקובץ לא נשמר ולא נכנס להוצאות של היומן.</p><div class="cm-drop" data-r="drop" tabindex="0" role="button">גרור לכאן קובץ, או לחץ לבחירה<br><span class="mx-sub">xlsx · xls · csv</span></div>`;

    R("imp").hidden=false}

  /* ---- tree ---- */
  function alloc(){let left=S.tree.deposit||0;return S.tree.goals.map(g=>{const rem=Math.max(0,(g.t||0)-(g.s||0));const ml=Math.max(1,monthsUntil(g.d)??12);const need=rem/ml;
    const a=Math.min(need,left);left-=a;const p=rem<=0?1:need>0?a/need:1;const eta=a>0?addMonths(rem/a):null;return Object.assign({},g,{need,a,p,eta,rem})})}
  const FRUITS=[[180,62],[118,92],[244,92],[150,140],[214,138],[92,146],[270,146],[180,108]];
  function treeSVG(){
    const A=alloc();const on=(S.tree.deposit||0)>0;const stroke=on?"var(--ink)":"var(--vv-wire)";const dash=on?"":' stroke-dasharray="6 5"';
    const fr=A.slice(0,8).map((g,i)=>{const [x,y]=FRUITS[i];const r=Math.max(11,Math.min(20,8+Math.log10(Math.max(10,g.t))*2.6));const st=stOf(g.p);
      const fs=st==="none"?"var(--vv-wire)":"var(--ink)";
      return `<clipPath id="vm-f${i}"><rect x="${x-r}" y="${y+r-2*r*g.p}" width="${2*r}" height="${2*r*g.p}"/></clipPath>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col(st)}" clip-path="url(#vm-f${i})"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${fs}" stroke-width="2"${st==="none"?' stroke-dasharray="4 4"':""}/>
      <path d="M${x} ${y-r} q3 -7 9 -8" fill="none" stroke="${fs}" stroke-width="2" stroke-linecap="round"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${st==="none"?"var(--faint)":"#111"}">${i+1}</text>`}).join("");
    return `<svg viewBox="0 0 360 270" role="img" aria-label="עץ היעדים">
      <line x1="20" y1="232" x2="340" y2="232" stroke="var(--line)" stroke-width="2"/>
      <path d="M180 40 C120 34 70 70 66 116 C40 128 42 176 86 182 C110 196 150 190 180 186 C210 190 250 196 274 182 C318 176 320 128 294 116 C290 70 240 34 180 40 Z" fill="none" stroke="${stroke}" stroke-width="2.5"${dash}/>
      <path d="M168 232 L170 186 C150 174 136 160 128 150 M170 186 L172 160 M190 232 L188 186 C206 176 222 164 232 150 M188 186 L188 162" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"${dash}/>
      <path d="M168 232 C150 240 130 242 112 252 M176 232 C172 244 166 252 160 262 M184 232 C190 244 196 252 204 262 M190 232 C210 240 230 242 248 252" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"${dash}/>
      ${fr}</svg>`}
  function buildGoals(){
    const A=alloc();
    R("goals").innerHTML=A.length?A.map((g,i)=>{const st=stOf(g.p);
      const txt=g.rem<=0?"היעד הושג":g.p>=1?`ממומן: ${fmt(g.a)} בחודש, יושג ב${monLbl(g.d)}`:g.a>0?`מקבל ${fmt(g.a)} מתוך ${fmt(g.need)} בחודש. בקצב הזה יושג ב${monLbl(g.eta)}`:`לא מקבל כסף כרגע. צריך ${fmt(g.need)} בחודש כדי להגיע עד ${monLbl(g.d)}`;
      return `<div class="vm-goal"><span class="pr"><button type="button" data-up="${i}" aria-label="העלה בעדיפות" ${i===0?"disabled":""}>▲</button><button type="button" data-dn="${i}" aria-label="הורד בעדיפות" ${i===A.length-1?"disabled":""}>▼</button></span>
        <input class="mx-inp" value="${esc(g.n)}" data-gn="${i}" aria-label="שם היעד" maxlength="40">
        <input class="mx-inp" type="number" min="0" step="500" value="${g.t}" data-gt="${i}" aria-label="סכום היעד">
        <input class="mx-inp dt" type="month" value="${g.d||""}" data-gd="${i}" aria-label="מועד היעד">
        <button class="mx-icon" type="button" data-gx="${i}" aria-label="מחק יעד">${TRASH}</button>
        <span class="st"><span class="mx-pill ${st}">${i+1}</span> ${txt} · נחסך עד היום <input class="mx-inp" type="number" min="0" step="500" value="${g.s||0}" data-gs="${i}" aria-label="נחסך עד היום" style="width:100px;padding:3px 6px;display:inline-block"></span></div>`}).join(""):`<div class="mx-empty">אין יעדים. הוסף יעד ראשון.</div>`;
    const G=S.tree.goals,B=R("goals");
    const mv=(i,j)=>{[G[i],G[j]]=[G[j],G[i]];refreshTree(true);changed()};
    B.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1));
    B.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>mv(+b.dataset.dn,+b.dataset.dn+1));
    B.querySelectorAll("[data-gn]").forEach(x=>x.onchange=()=>{G[+x.dataset.gn].n=x.value.trim()||"יעד";changed()});
    B.querySelectorAll("[data-gt]").forEach(x=>x.onchange=()=>{G[+x.dataset.gt].t=Math.max(0,+x.value||0);refreshTree(true);changed()});
    B.querySelectorAll("[data-gs]").forEach(x=>x.onchange=()=>{G[+x.dataset.gs].s=Math.max(0,+x.value||0);refreshTree(true);changed()});
    B.querySelectorAll("[data-gd]").forEach(x=>x.onchange=()=>{G[+x.dataset.gd].d=x.value;refreshTree(true);changed()});
    B.querySelectorAll("[data-gx]").forEach(x=>x.onclick=()=>{G.splice(+x.dataset.gx,1);refreshTree(true);changed()});
  }
  function refreshTree(rebuild){
    R("treeart").innerHTML=treeSVG();R("dep").textContent=fmt(S.tree.deposit)+" בחודש";
    const A=alloc();const fund=A.filter(g=>g.p>=1).length;const ts=!A.length?"none":fund===A.length?"ok":A.some(g=>g.p>0)?"part":"none";
    R("dep").className="vm-big "+ts;
    const needAll=A.reduce((a,g)=>a+g.need,0);
    R("treesum").textContent=!A.length?"":fund===A.length?`כל ${A.length} היעדים ממומנים בזמן${S.tree.deposit>needAll?`, ונשארים ${fmt(S.tree.deposit-needAll)} בחודש`:""}.`:`${fund} מתוך ${A.length} יעדים ממומנים בזמן. כדי לממן את כולם צריך ${fmt(needAll)} בחודש.`;
    if(rebuild)buildGoals();else{/* update status texts only */buildGoals()}
  }
  R("deprange").oninput=()=>{S.tree.deposit=+R("deprange").value;R("treeart").innerHTML=treeSVG();refreshTreeLite();changed()};
  function refreshTreeLite(){R("dep").textContent=fmt(S.tree.deposit)+" בחודש";clearTimeout(refreshTreeLite.t);refreshTreeLite.t=setTimeout(()=>refreshTree(true),120)}
  R("addgoal").onclick=()=>{S.tree.goals.push({n:"יעד חדש",t:10000,s:0,d:addMonths(12)});refreshTree(true);changed();const ins=R("goals").querySelectorAll("[data-gn]");const last=ins[ins.length-1];if(last){last.focus();last.select()}};

  /* ---- suitcase ---- */
  const SPOTS=[[92,92,-8],[196,86,6],[140,140,4],[244,140,-6],[92,186,7],[200,190,-4]];
  function suitSVG(){
    const T=S.trips.slice().sort((a,b)=>(a.d||"").localeCompare(b.d||"")).slice(0,6);
    const st=T.map((t,i)=>{const [x,y,rot]=SPOTS[i];const past=monthsUntil(t.d)<0;const p=past?1:pct(t.s,t.t);const s=past?"ok":stOf(p);
      const w=96,h=34;const stroke=s==="none"?"var(--vv-wire)":"var(--ink)";const yr=(t.d||"").slice(0,4);
      return `<g transform="rotate(${rot} ${x} ${y})"><clipPath id="vm-s${i}"><rect x="${x-w/2+w*(1-p)}" y="${y-h/2}" width="${w*p}" height="${h}"/></clipPath>
        <rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${col(s)}" clip-path="url(#vm-s${i})"/>
        <rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="none" stroke="${stroke}" stroke-width="2"${s==="none"?' stroke-dasharray="5 4"':""}/>
        <text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${s==="none"?"var(--faint)":"#111"}">${esc((t.n||"").slice(0,10))} ${yr}</text></g>`}).join("");
    return `<svg viewBox="0 0 300 250" role="img" aria-label="מזוודה עם מדבקות נסיעה">
      <line x1="10" y1="242" x2="290" y2="242" stroke="var(--line)" stroke-width="2"/>
      <path d="M118 46 L118 26 Q118 18 126 18 L174 18 Q182 18 182 26 L182 46" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="34" y="46" width="232" height="184" rx="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <line x1="34" y1="70" x2="266" y2="70" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="70" cy="238" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><circle cx="230" cy="238" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
      ${st}</svg>`}
  function buildTrips(){
    const B=R("trips");
    B.innerHTML=S.trips.length?S.trips.map((t,i)=>{const mu=monthsUntil(t.d);const past=mu!=null&&mu<0;const p=past?1:pct(t.s,t.t);const s=past?"ok":stOf(p);
      const when=mu==null?"":past?"הייתה ב"+monLbl(t.d):mu===0?"החודש!":"בעוד "+mu+" חודשים";
      return `<div class="vm-trip"><div class="mx-row"><input class="mx-inp" value="${esc(t.n)}" data-tn="${i}" maxlength="24" aria-label="יעד הנסיעה" style="flex:1;font-weight:600"><button class="mx-icon" type="button" data-tx="${i}" aria-label="מחק נסיעה">${TRASH}</button></div>
        <div class="f2"><label class="mx-f">חודש<input class="mx-inp" type="month" value="${t.d||""}" data-td="${i}"></label><label class="mx-f">עלות משוערת<input class="mx-inp" type="number" min="0" step="500" value="${t.t||0}" data-tt="${i}"></label></div>
        ${past?"":`<label class="mx-f">נחסך עד היום<input class="mx-inp" type="number" min="0" step="500" value="${t.s||0}" data-ts="${i}"></label>`}
        <div class="bar"><span style="width:${p*100}%;background:${s==="none"?"transparent":col(s)}"></span></div>
        <div class="mx-row"><span class="mx-pill ${s}">${past?"זיכרון":s==="ok"?"ממומן":s==="part"?Math.round(p*100)+"%":"עוד לא התחלנו"}</span><span class="mx-sub">${when}</span></div></div>`}).join(""):`<div class="mx-empty">אין נסיעות. הוסף את הראשונה.</div>`;
    const T=S.trips;
    B.querySelectorAll("[data-tn]").forEach(x=>x.onchange=()=>{T[+x.dataset.tn].n=x.value.trim()||"נסיעה";refreshTrips();changed()});
    B.querySelectorAll("[data-td]").forEach(x=>x.onchange=()=>{T[+x.dataset.td].d=x.value;refreshTrips();changed()});
    B.querySelectorAll("[data-tt]").forEach(x=>x.onchange=()=>{T[+x.dataset.tt].t=Math.max(0,+x.value||0);refreshTrips();changed()});
    B.querySelectorAll("[data-ts]").forEach(x=>x.onchange=()=>{T[+x.dataset.ts].s=Math.max(0,+x.value||0);refreshTrips();changed()});
    B.querySelectorAll("[data-tx]").forEach(x=>x.onclick=()=>{T.splice(+x.dataset.tx,1);refreshTrips();changed()});
  }
  function refreshTrips(){
    R("suitart").innerHTML=suitSVG();buildTrips();
    const up=S.trips.filter(t=>t.d&&monthsUntil(t.d)>=0).sort((a,b)=>a.d.localeCompare(b.d))[0];
    if(!up){R("nextq").textContent="הנסיעה הבאה";R("nextbig").className="vm-big none";R("nextbig").textContent="עוד לא תוכננה";R("nextsub").textContent="הוסף נסיעה עם חודש ועלות משוערת";return}
    const mu=monthsUntil(up.d);const p=pct(up.s,up.t);const s=stOf(p);
    R("nextq").textContent="הנסיעה הבאה: "+up.n;R("nextbig").className="vm-big "+s;R("nextbig").textContent=mu===0?"החודש":mu===1?"בעוד חודש":mu===2?"בעוד חודשיים":"בעוד "+mu+" חודשים";
    const rem=Math.max(0,up.t-up.s);R("nextsub").textContent=rem<=0?`ממומנת במלואה (${fmt(up.t)})`:`נחסכו ${fmt(up.s)} מתוך ${fmt(up.t)}. חסרים ${fmt(rem)}${mu>0?`, כלומר ${fmt(rem/mu)} בחודש`:""}.`;
  }
  R("addtrip").onclick=()=>{S.trips.push({n:"נסיעה חדשה",d:addMonths(12),t:15000,s:0});refreshTrips();changed()};

  function renderAll(){R("ex").hidden=!S.example;buildLayers();updBed();R("deprange").value=S.tree.deposit||0;refreshTree(true);refreshTrips();renderDots()}
  renderAll();
  getDb().then(d=>{if(!alive)return;if(!d){R("dbwarn").hidden=false;return}db=d;
    unsub=db.doc(DOC).onSnapshot(snap=>{if(!snap.exists||snap.metadata.hasPendingWrites)return;const v=snap.data();const js=JSON.stringify(v);if(js===JSON.stringify(S))return;
      const ae=document.activeElement;if(ae&&root.contains(ae)&&ae.tagName==="INPUT")return;
      S=Object.assign(JSON.parse(JSON.stringify(EXAMPLE)),JSON.parse(js));lastSaved=js;renderAll()},()=>{})});
  return ()=>{alive=false;clearTimeout(saveT);save();if(unsub)try{unsub()}catch(e){}};
};
})();
</script>

<style id="gozo-skin">/* ===== Gozo skin v1: one clean visual language (tokens, type, surfaces) ===== */
:root{--bg:#F2F3F7;--surface:#FFFFFF;--surface-2:#F2F4F7;--line:#EAECF0;--ink:#101828;--muted:#5D6679;--faint:#667085;--brand:#2563EB;--brand-ink:#FFFFFF;--brand-soft:#EAF1FF;--income:#067647;--income-soft:#ECFDF3;--spend:#B42318;--spend-soft:#FEF3F2;--gold:#B54708;--gold-soft:#FFFAEB;--scrim:rgba(16,24,40,.45);--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--font-display:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif;--font-body:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif;--r-lg:20px;--r-md:14px;--r-sm:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0D12;--surface:#16181F;--surface-2:#1F222B;--line:#2A2E39;--ink:#F2F4F7;--muted:#A3ACBD;--faint:#98A2B3;--brand:#6B9BFF;--brand-ink:#0B0D12;--brand-soft:#1A2547;--income:#32D583;--income-soft:#0F2A1E;--spend:#F97066;--spend-soft:#33191A;--gold:#FDB022;--gold-soft:#33270F;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0B0D12;--surface:#16181F;--surface-2:#1F222B;--line:#2A2E39;--ink:#F2F4F7;--muted:#A3ACBD;--faint:#98A2B3;--brand:#6B9BFF;--brand-ink:#0B0D12;--brand-soft:#1A2547;--income:#32D583;--income-soft:#0F2A1E;--spend:#F97066;--spend-soft:#33191A;--gold:#FDB022;--gold-soft:#33270F;--shadow:0 1px 2px rgba(0,0,0,.4)}
body{font-family:var(--font-body)}
.card{border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.mobile-title,.screen-title{font-weight:700;letter-spacing:-.5px}

.page-head h1{font-weight:700;letter-spacing:-.4px}
.card-head h2,.card h2{font-weight:700;letter-spacing:-.2px}
.hero-num,.vault-num{color:var(--ink);font-weight:700;letter-spacing:-1px}
.segmented{background:var(--surface-2);border:0;padding:2px;border-radius:10px}
.seg-btn{color:var(--ink);border-radius:8px}
.seg-btn[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12),0 1px 2px rgba(16,24,40,.06)}
:root[data-theme=dark] .seg-btn[aria-pressed=true]{background:#2C303B}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg-btn[aria-pressed=true]{background:#2C303B}}
.vault-hero{background:var(--surface)}
.sum-tile,.filter-sum{background:var(--surface-2)}
.carousel .chip[aria-pressed=true]{box-shadow:none}
.chip{border-radius:999px}
.btn{border-radius:12px}
.tabbar{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line)}
.tab-btn[aria-current=page]{color:var(--brand)}
.day-head{font-weight:500}
.period-spacer{height:6px}
/* ===== Gozo skin v2: structure (grouped lists, edit on demand, info on demand) ===== */
.mobile-title{font-size:28px!important;font-weight:700}
/* page intro text behind an info button */
.page-head p{display:none}.page-head.info-open p{display:block}
.pg-info{border:0;background:none;color:var(--brand);font:500 14px var(--font-body);padding:4px 0;min-height:36px;cursor:pointer}
/* budget summary: one big number, the rest as list rows */
.budget-summary{display:flex!important;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden}
.budget-summary .sum-tile{background:none;border-radius:0;flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;padding:12px 14px;border-top:1px solid var(--line)}
.budget-summary .sum-tile .sub{flex-basis:100%;font-size:12px}
.budget-summary .sum-tile .val{font-weight:600}
.budget-summary .sum-tile:nth-child(3){order:-1;border-top:0;flex-direction:column;align-items:flex-start;background:var(--brand-soft)}
.budget-summary .sum-tile:nth-child(3) .val{font-size:34px;font-weight:700;letter-spacing:-.8px;color:var(--ink)}
/* budget categories: iOS rows, amount field only when editing */
.budget-row{grid-template-columns:minmax(0,1fr) auto!important;gap:6px 12px!important;padding:12px 0!important;position:relative}
.budget-row .budget-name{grid-column:1}
.budget-row .budget-progress{grid-column:1 / -1;grid-row:2}
.budget-row .money-input{grid-column:1 / -1;grid-row:3;display:none}
.budget-row.editing .money-input{display:flex}
.budget-row .cat-emoji{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;background:var(--surface-2);margin-inline-end:6px;font-size:15px}
.bd-edit{grid-column:2;grid-row:1;align-self:center;border:0;background:var(--surface-2);color:var(--brand);border-radius:999px;font:600 13px var(--font-body);padding:7px 12px;min-height:34px;cursor:pointer}
.budget-row.editing .bd-edit{background:var(--brand);color:var(--brand-ink)}
.budget-progress .bar{height:6px!important;border-radius:3px!important}
/* vault: values read like list values, not form boxes */
.asset-row{grid-template-columns:minmax(0,1fr) 128px}
.asset-value.money-input{border-color:transparent;background:var(--surface-2);border-radius:10px}
.asset-value.money-input:focus-within{border-color:var(--brand);background:var(--surface)}
.vault-group .card-head{margin-bottom:6px}
.vault-group-sum{font-weight:700}
.money-input{border-radius:10px}
/* home chips row: quieter */
.status-row .cc-chip{box-shadow:none}
</style><script>
/* skin v2 helpers: info button on page intros, edit toggle on budget rows */
(function(){var busy=!1;function run(){if(busy)return;busy=!0;try{
 document.querySelectorAll(".page-head").forEach(function(h){var p=h.querySelector("p");if(!p||h.querySelector(".pg-info"))return;var b=document.createElement("button");b.type="button";b.className="pg-info";b.textContent="ⓘ מה יש כאן?";b.onclick=function(){var o=h.classList.toggle("info-open");b.textContent=o?"ⓘ הסתרה":"ⓘ מה יש כאן?"};p.parentNode.insertBefore(b,p)});
 document.querySelectorAll(".budget-row").forEach(function(r){if(r.querySelector(".bd-edit"))return;var b=document.createElement("button");b.type="button";b.className="bd-edit";b.textContent="עריכה";b.onclick=function(){var on=r.classList.toggle("editing");b.textContent=on?"סיום":"עריכה";if(on){var i=r.querySelector(".money-input input");i&&setTimeout(function(){i.focus()},30)}};r.appendChild(b)});
}finally{busy=!1}}
var t=0;new MutationObserver(function(){if(busy)return;clearTimeout(t);t=setTimeout(run,80)}).observe(document.documentElement,{subtree:!0,childList:!0});})();
</script></body></html>
